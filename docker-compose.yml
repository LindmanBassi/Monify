services:
  mysql:
    image: mysql:8.4
    container_name: monify-mysql
    environment:
      MYSQL_DATABASE: monify
      MYSQL_USER: monify
      MYSQL_PASSWORD: monify
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - monify-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umonify", "-pmonify"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  monify-mysql-data:

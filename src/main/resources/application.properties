spring.application.name=Monify

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/monify}
spring.datasource.username=${DB_USERNAME:monify}
spring.datasource.password=${DB_PASSWORD:monify}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

monify.fuso-horario=America/Sao_Paulo

monify.autenticacao.segredo-jwt=${JWT_SEGREDO:segredo-local-de-desenvolvimento-nao-usar-em-producao}
monify.autenticacao.duracao-token-acesso=15m
monify.autenticacao.duracao-token-renovacao=7d

spring.data.web.pageable.max-page-size=100
